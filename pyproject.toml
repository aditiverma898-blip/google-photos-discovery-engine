[project]
name = "google-photos-discovery-engine"
version = "1.0.0"
description = "Read-only research workspace for Google Photos retrieval complaints"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "google-genai>=1.0.0",
    "aiosqlite>=0.20.0",
    "sqlite-vec>=0.1.0",
]

[tool.vercel]
entrypoint = "backend.api.main:app"

[tool.vercel.scripts]
build = "npm ci --prefix frontend && npm run build --prefix frontend"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
